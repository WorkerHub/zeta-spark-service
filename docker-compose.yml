services:
  spark:
    image: workerhub/zeta-spark-service:latest
    container_name: spark-sql-service
    restart: unless-stopped
    ports:
      # 默认只绑本机；要对外提供服务请走反向代理/隧道，不要直接改成 0.0.0.0 裸奔
      - "127.0.0.1:8080:8080"
    environment:
      SPARK_API_TOKEN: ${SPARK_API_TOKEN:?请在 .env 里设置 SPARK_API_TOKEN}
      # SPARK_DRIVER_MEMORY: 2g
      # SPARK_MASTER: local[*]
    volumes:
      # 库表元数据（Derby metastore）与托管表数据都在这个卷里，删卷 = 数据全丢
      - spark-data:/data/spark

volumes:
  spark-data:
